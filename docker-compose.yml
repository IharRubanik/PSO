services:
  db:
    image: postgres:16-alpine
    container_name: pso-db
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: pso
      POSTGRES_USER: pso_user
      POSTGRES_PASSWORD: pso_secret_2026
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
