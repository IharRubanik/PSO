      - generic [ref=e31]:
        - heading "Политика конфиденциальности" [level=1] [ref=e33]
        - paragraph [ref=e35]: Компания Фантом Групп уделяет особое внимание защите персональных данных пользователей. Мы стремимся к прозрачности и безопасности в обращении с любой информацией, которую вы предоставляете при использовании нашего сайта и услуг.
        - generic [ref=e37]:
          - generic [ref=e38]:
            - heading "1. Общие положения" [level=2] [ref=e39]
            - paragraph [ref=e40]: "В данной Политике под понятием «персональная информация Пользователя» понимаются следующие данные:"
            - paragraph [ref=e41]: "Персональная информация, которую Пользователь предоставляет о себе самостоятельно при регистрации (создании учётной записи) или в процессе использования Сервисов. Эта информация является обязательной для предоставления и включает в себя: имя Пользователя, номер телефона, адрес электронной почты. Персональная информация предоставляется Пользователем на добровольной основе. Иная информация о Пользователе обрабатывается в обезличенной форме."
            - paragraph [ref=e42]: Местоположение устройства и Сайт не является биометрическими идентификаторами личности. Все собранные данные являются анонимными и не могут быть использованы для установления личности Пользователя.
          - generic [ref=e43]:
            - heading "2. Цели обработки персональной информации пользователей" [level=2] [ref=e44]
            - paragraph [ref=e45]: "Настоящая Политика обработки персональных данных устанавливает следующие цели:"
            - list [ref=e46]:
              - listitem [ref=e47]: Идентификация стороны при предоставлении охранных услуг
              - listitem [ref=e48]: Предоставление пользователю персонализированных услуг и сервисов
              - listitem [ref=e49]: Предоставление доступа к специализированным разделам Сайта
              - listitem [ref=e50]: Связь с Пользователем, включая направление уведомлений и запросов
              - listitem [ref=e51]: Предоставление Пользователю обратной связи, рекламы и маркетинга
            - paragraph [ref=e52]: Мы не храним, не обрабатываем и не передаём третьим лицам информацию, которая была бы собрана без согласия субъекта персональных данных, за исключением случаев, предусмотренных действующим законодательством.
          - generic [ref=e53]:
            - heading "3. Основные права и обязанности оператора" [level=2] [ref=e54]
            - paragraph [ref=e55]: "Оператор имеет право:"
            - list [ref=e56]:
              - listitem [ref=e57]: получать от субъекта персональных данных достоверную информацию и/или документы, содержащие персональные данные
              - listitem [ref=e58]: в случаях отзыва субъектом персональных данных согласия на обработку персональных данных, а также направления обращения с требованием о прекращении обработки персональных данных
              - listitem [ref=e59]: использовать программное обеспечение Сайта и сторонние инструменты, необходимые для обеспечения работоспособности
            - paragraph [ref=e60]: "Оператор обязан:"
            - list [ref=e61]:
              - listitem [ref=e62]: предоставлять субъекту персональных данных по его просьбе информацию, касающуюся обработки его персональных данных
              - listitem [ref=e63]: обеспечивать защиту персональных данных от неправомерного доступа
              - listitem [ref=e64]: опубликовать или иным образом обеспечить неограниченный доступ к настоящей Политике в отношении обработки персональных данных
          - generic [ref=e65]:
            - heading "4. Принципы обработки персональных данных" [level=2] [ref=e66]
            - list [ref=e67]:
              - listitem [ref=e68]: Обработка персональных данных осуществляется на законной основе
              - listitem [ref=e69]: Обработка ограничена достижением заранее определённых целей
              - listitem [ref=e70]: Содержание и объём обрабатываемых данных соответствует заявленным целям обработки. Не допускается избыточность обрабатываемых данных
              - listitem [ref=e71]: При обработке персональных данных обеспечивается точность и достаточность данных
              - listitem [ref=e72]: Хранение персональных данных осуществляется не дольше, чем того требуют цели обработки
              - listitem [ref=e73]: Обрабатываемые персональные данные подлежат уничтожению по достижении целей обработки
          - generic [ref=e74]:
            - heading "5. Порядок сбора, хранения, передачи и других видов обработки персональных данных" [level=2] [ref=e75]
            - paragraph [ref=e76]: Оператор обеспечивает сохранность персональных данных и принимает все возможные меры, исключающие доступ неуполномоченных лиц.
            - paragraph [ref=e77]: Персональные данные Пользователя никогда, ни при каких условиях не будут переданы третьим лицам, за исключением случаев, связанных с исполнением действующего законодательства.
          - generic [ref=e78]:
            - heading "6. Перечень действий, производимых оператором с полученными персональными данными" [level=2] [ref=e79]
            - paragraph [ref=e80]: Оператор осуществляет сбор, запись, систематизацию, накопление, хранение, уточнение (обновление, изменение), извлечение, использование, передачу (распространение, предоставление, доступ), обезличивание, блокирование, удаление и уничтожение персональных данных.
          - generic [ref=e81]:
            - heading "7. Конфиденциальность персональных данных" [level=2] [ref=e82]
            - paragraph [ref=e83]: Оператор и иные лица, получившие доступ к персональным данным, обязаны не раскрывать третьим лицам и не распространять персональные данные без согласия субъекта персональных данных, если иное не предусмотрено федеральным законом.
            - paragraph [ref=e84]: Пользователь может в любой момент изменить (обновить, дополнить) предоставленную персональную информацию, используя функции обратной связи.
            - paragraph [ref=e85]: В целях исполнения и будет изменить настоящая Политика обработки персональных данных Оператором. Политика действует бессрочно до замены её новой редакцией.
            - paragraph [ref=e86]: Актуальная версия Политики в свободном доступе расположена на данной странице.
