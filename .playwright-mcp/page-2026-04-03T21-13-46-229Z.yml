      - heading "Политика конфиденциальности" [level=1] [ref=e33]
      - generic [ref=e35]:
        - generic [ref=e36]:
          - heading "1. Общие положения" [level=2] [ref=e37]
          - paragraph [ref=e38]: Настоящая Политика конфиденциальности определяет порядок обработки и защиты персональных данных физических лиц, пользующихся услугами сайта. Оператор обеспечивает защиту обрабатываемых персональных данных от несанкционированного доступа и разглашения в соответствии с законодательством Российской Федерации.
          - paragraph [ref=e39]: Оператор вправе вносить изменения в настоящую Политику конфиденциальности. При внесении изменений в заголовке Политики указывается дата последнего обновления. Новая редакция Политики вступает в силу с момента её размещения на сайте.
        - generic [ref=e40]:
          - heading "2. Сбор персональных данных" [level=2] [ref=e41]
          - paragraph [ref=e42]: "Персональные данные собираются при заполнении форм обратной связи на сайте. К персональным данным относятся: имя, номер телефона, адрес электронной почты и содержание сообщения."
          - paragraph [ref=e43]: Сбор персональных данных осуществляется исключительно с согласия субъекта персональных данных. Согласие выражается путём проставления отметки в соответствующем поле формы обратной связи.
        - generic [ref=e44]:
          - heading "3. Использование персональных данных" [level=2] [ref=e45]
          - paragraph [ref=e46]: Персональные данные используются для связи с пользователем, обработки запросов и заявок, предоставления информации об услугах компании, а также для улучшения качества обслуживания.
          - paragraph [ref=e47]: Оператор не передаёт персональные данные третьим лицам без согласия субъекта персональных данных, за исключением случаев, предусмотренных законодательством Российской Федерации.
        - generic [ref=e48]:
          - heading "4. Защита персональных данных" [level=2] [ref=e49]
          - paragraph [ref=e50]: Оператор принимает необходимые организационные и технические меры для защиты персональных данных от неправомерного или случайного доступа, уничтожения, изменения, блокирования, копирования, распространения.
          - paragraph [ref=e51]: Доступ к персональным данным имеют только уполномоченные сотрудники компании, которые обязались соблюдать конфиденциальность.
        - generic [ref=e52]:
          - heading "5. Права субъекта персональных данных" [level=2] [ref=e53]
          - paragraph [ref=e54]: Субъект персональных данных имеет право на получение информации об обработке его персональных данных, на уточнение, блокирование или уничтожение своих персональных данных, а также на отзыв согласия на обработку персональных данных.
        - generic [ref=e55]:
          - heading "6. Файлы cookie" [level=2] [ref=e56]
          - paragraph [ref=e57]: Сайт использует файлы cookie для обеспечения корректной работы, персонализации контента и анализа трафика. Пользователь может отключить использование файлов cookie в настройках браузера, однако это может повлиять на функциональность сайта.
        - generic [ref=e58]:
          - heading "7. Контактная информация" [level=2] [ref=e59]
          - paragraph [ref=e60]: "По всем вопросам, связанным с обработкой персональных данных, вы можете обратиться по адресу электронной почты: info@security-company.ru или по телефону: 8 999 999-99-99."
