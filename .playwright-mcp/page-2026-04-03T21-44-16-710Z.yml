      - generic [ref=e31]:
        - heading "Политика конфиденциальности" [level=1] [ref=e33]
        - generic [ref=e34]:
          - paragraph [ref=e35]: Компания Фантом групп уделяет особое внимание защите вашей конфиденциальности. Мы стремимся обеспечить прозрачность и безопасность в отношении любой информации, которую вы предоставляете нам при использовании нашего веб-сайта (далее — «Сайт»), его сервисов, программ и связанных с ним услуг.
          - paragraph [ref=e36]: Использование сервисов Сайта означает безоговорочное согласие Пользователя с настоящей Политикой; в случае несогласия Пользователь должен воздержаться от использования сервисов.
        - generic [ref=e38]:
          - generic [ref=e39]:
            - heading "1. Общие положения" [level=2] [ref=e40]
            - paragraph [ref=e41]: "1.1. В данной Политике под понятием «персональная информация Пользователя» понимаются следующие аспекты:"
            - paragraph [ref=e42]: 1.1.1. Персональная информация, которую Пользователь предоставляет о себе самостоятельно при заполнении и отправке форм заявок, подписки на обновления или при использовании Сервисов. Эта информация включает в себя персональные данные Пользователя. Некоторая информация, необходимая для предоставления Сервисов, обязательно помечена специальным образом. В то же время, Пользователь вправе предоставлять иной информации по своему усмотрению.
            - paragraph [ref=e43]: 1.1.2. Данные, которые автоматически передаются сервисам Сайта в ходе их использования при помощи установленного на устройстве Пользователя программного обеспечения. Эти данные включают в себя IP-адрес, информацию о файлах cookie, сведения о браузере Пользователя (или другой программе, используемой для доступа к сервисам), технические характеристики оборудования и программного обеспечения, используемых Пользователем, а также дату и время доступа к сервисам, адреса запрашиваемых страниц и подобную информацию.
            - paragraph [ref=e44]: 1.1.3. Прочая информация о Пользователе, обработка которой предусмотрена в Соглашении об использовании Сайта.
            - paragraph [ref=e45]: 1.1.4. Настоящая Политика конфиденциальности применяется исключительно к Сайту. Компания не контролирует и не несет ответственности за сайты третьих лиц, на которые Пользователь может перейти по ссылкам, доступным на Сайте.
          - generic [ref=e46]:
            - heading "2. Цели обработки персональной информации пользователей" [level=2] [ref=e47]
            - paragraph [ref=e48]: "Мы используем собранную информацию для следующих целей:"
            - paragraph [ref=e49]:
              - text: — Предоставление вам запрашиваемых услуг и обратной связи.
              - text: — Персонализация вашего опыта использования нашего сайта и услуг.
              - text: — Улучшение качества наших услуг и разработка новых продуктов и сервисов.
              - text: — Предоставление вам информации о наших продуктах, акциях и мероприятиях.
            - paragraph [ref=e50]: Мы не продаем, не обмениваем и не передаем вашу личную информацию третьим лицам без вашего согласия, за исключением случаев, предусмотренных законодательством.
          - generic [ref=e51]:
            - heading "3. Основные права и обязанности Оператора" [level=2] [ref=e52]
            - paragraph [ref=e53]: "3.1. Оператор имеет право:"
            - paragraph [ref=e54]:
              - text: — получать от субъекта персональных данных достоверные информацию и/или документы, содержащие персональные данные;
              - text: — в случае отзыва субъектом персональных данных согласия на обработку персональных данных, а также, направления обращения с требованием о прекращении обработки персональных данных, Оператор вправе продолжить обработку персональных данных без согласия субъекта персональных данных при наличии оснований, указанных в Законе о персональных данных;
              - text: — самостоятельно определять состав и перечень мер, необходимых и достаточных для обеспечения выполнения обязанностей, предусмотренных Законом о персональных данных и принятыми в соответствии с ним нормативными правовыми актами, если иное не предусмотрено Законом о персональных данных или другими федеральными законами.
            - paragraph [ref=e55]: "3.2. Оператор обязан:"
            - paragraph [ref=e56]:
              - text: — предоставлять субъекту персональных данных по его просьбе информацию, касающуюся обработки его персональных данных;
              - text: — организовывать обработку персональных данных в порядке, установленном действующим законодательством страны;
              - text: — отвечать на обращения и запросы субъектов персональных данных и их законных представителей в соответствии с требованиями Закона о персональных данных;
              - text: — сообщать в уполномоченный орган по защите прав субъектов персональных данных по запросу этого органа необходимую информацию в течение 10 дней с даты получения такого запроса;
              - text: — публиковать или иным образом обеспечивать неограниченный доступ к настоящей Политике в отношении обработки персональных данных;
              - text: — принимать правовые, организационные и технические меры для защиты персональных данных от неправомерного или случайного доступа к ним, уничтожения, изменения, блокирования, копирования, предоставления, распространения персональных данных, а также от иных неправомерных действий в отношении персональных данных;
              - text: — прекратить передачу (распространение, предоставление, доступ) персональных данных, прекратить обработку и уничтожить персональные данные в порядке и случаях, предусмотренных Законом о персональных данных;
              - text: — исполнять иные обязанности, предусмотренные Законом о персональных данных.
          - generic [ref=e57]:
            - heading "4. Принципы обработки персональных данных" [level=2] [ref=e58]
            - paragraph [ref=e59]: 4.1. Обработка персональных данных осуществляется на законной основе.
            - paragraph [ref=e60]: 4.2. Обработке подлежат только персональные данные, которые отвечают целям их обработки.
            - paragraph [ref=e61]: 4.3. Содержание и объем обрабатываемых персональных данных соответствуют заявленным целям обработки. Не допускается избыточность обрабатываемых персональных данных по отношению к заявленным целям их обработки.
            - paragraph [ref=e62]: 4.4. При обработке персональных данных обеспечивается точность персональных данных, их достаточность, а в необходимых случаях и актуальность по отношению к целям обработки персональных данных. Оператор принимает необходимые меры и/или обеспечивает их принятие по удалению или уточнению неполных или неточных данных.
            - paragraph [ref=e63]: 4.5. Хранение персональных данных осуществляется в форме, позволяющей определить субъекта персональных данных, не дольше, чем этого требуют цели обработки персональных данных, если срок хранения персональных данных не установлен федеральным законом, договором, стороной которого, выгодоприобретателем или поручителем по которому является субъект персональных данных.
            - paragraph [ref=e64]: 4.6. Обрабатываемые персональные данные уничтожаются либо обезличиваются по достижении целей обработки или в случае утраты необходимости в достижении этих целей, если иное не предусмотрено федеральным законом.
          - generic [ref=e65]:
            - heading "5. Порядок сбора, хранения, передачи и других видов обработки персональных данных" [level=2] [ref=e66]
            - paragraph [ref=e67]: 5.1. Оператор обеспечивает сохранность персональных данных и принимает все возможные меры, исключающие доступ к персональным данным неуполномоченных лиц.
            - paragraph [ref=e68]: 5.2. Персональные данные Пользователя никогда, ни при каких условиях не будут переданы третьим лицам, за исключением случаев, связанных с исполнением действующего законодательства либо в случае, если субъектом персональных данных дано согласие Оператору на передачу данных третьему лицу для исполнения обязательств по гражданско-правовому договору.
            - paragraph [ref=e69]: 5.3. В случае выявления неточностей в персональных данных, Пользователь может актуализировать их самостоятельно, путем направления Оператору уведомление на адрес электронной почты Оператора info@security-company.ru с пометкой «Актуализация персональных данных».
            - paragraph [ref=e70]: 5.4. Пользователь может в любой момент отозвать свое согласие на обработку персональных данных, направив Оператору уведомление посредством электронной почты на электронный адрес Оператора info@security-company.ru с пометкой «Отзыв согласия на обработку персональных данных».
            - paragraph [ref=e71]: 5.5. Условием прекращения обработки персональных данных может являться достижение целей обработки персональных данных, истечение срока действия согласия субъекта персональных данных, отзыв согласия субъектом персональных данных или требование о прекращении обработки персональных данных, а также выявление неправомерной обработки персональных данных.
          - generic [ref=e72]:
            - heading "6. Перечень действий, производимых Оператором с полученными персональными данными" [level=2] [ref=e73]
            - paragraph [ref=e74]: 6.1. Оператор осуществляет сбор, запись, систематизацию, накопление, хранение, уточнение (обновление, изменение), извлечение, использование, передачу (распространение, предоставление, доступ), обезличивание, блокирование, удаление и уничтожение персональных данных.
          - generic [ref=e75]:
            - heading "7. Конфиденциальность персональных данных" [level=2] [ref=e76]
            - paragraph [ref=e77]: Оператор и иные лица, получившие доступ к персональным данным, обязаны не раскрывать третьим лицам и не распространять персональные данные без согласия субъекта персональных данных, если иное не предусмотрено федеральным законом.
            - paragraph [ref=e78]: Пользователь может получить любые разъяснения по интересующим вопросам, касающимся обработки его персональных данных, обратившись к Оператору с помощью электронной почты info@security-company.ru.
            - paragraph [ref=e79]: В данном документе будут отражены любые изменения политики обработки персональных данных Оператором. Политика действует бессрочно до замены ее новой версией.
            - paragraph [ref=e80]: Актуальная версия Политики в свободном доступе расположена на данной странице.
